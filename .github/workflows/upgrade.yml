name: Upgrade compatibility

on:
  pull_request:
    paths:
      - "quick_ternaries/**"
      - "launcher/**"
      - "setup.cfg"
      - "pyproject.toml"
      - "scripts/check_upgrade.py"
      - ".github/workflows/upgrade.yml"
  push:
    branches: [main]
    paths:
      - "quick_ternaries/**"
      - "launcher/**"
      - "setup.cfg"
      - "pyproject.toml"
      - "scripts/check_upgrade.py"
      - ".github/workflows/upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

env:
  # Advance this when preparing the next package version (see docs/release.md).
  PREVIOUS_RELEASE: v1.4.0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  upgrade:
    name: Previous release upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml
      - name: Install candidate dependencies and build tools
        run: python -m pip install ".[test]" build
      - name: Build candidate wheel
        run: python -m build --wheel --outdir dist/upgrade
      - name: Exercise previous CLI and launcher updaters
        shell: bash
        run: python scripts/check_upgrade.py --from-ref "$PREVIOUS_RELEASE" --wheel-dir dist/upgrade
